name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/implement-flutter-web-demo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: ./flutter_web_demo
        run: flutter pub get

      - name: Build web
        working-directory: ./flutter_web_demo
        run: flutter build web --release --base-href /RichTextEditorDemo/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./flutter_web_demo/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
